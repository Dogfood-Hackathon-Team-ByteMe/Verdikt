# Serves the built SPA and proxies the API on the same origin.
#
# Same-origin matters: the session cookie is httpOnly with SameSite=Lax, so
# routing /api through here means no CORS preflight and no cross-site cookie
# rules to get wrong. The frontend is built with VITE_API_URL=/ to match.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # The API accepts images up to 2 MB. nginx defaults to 1 MB, which
        # rejected anything larger with a bare 413 before the request ever
        # reached the API. The headroom lets the API answer with its own JSON
        # message instead of nginx's HTML error page.
        client_max_body_size 4m;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies come back from the API on this same origin, so they pass
        # through untouched.
        proxy_pass_request_headers on;
    }

    # The app is a single page; unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
