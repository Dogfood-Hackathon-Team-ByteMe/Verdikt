  <g transform="rotate(-32 14 13)">
    <rect x="12.7" y="10" width="2.6" height="10.4" rx="1.3" fill="#faf8f2" stroke="#16150f" stroke-width="1.4"/>
    <rect x="7.4" y="6" width="13.2" height="5.6" rx="2.2" fill="#faf8f2" stroke="#16150f" stroke-width="1.4"/>
  </g>
  <rect x="7" y="20.4" width="14" height="2.9" rx="1.45" fill="#ffd23f" stroke="#16150f" stroke-width="1.4"/>
</svg>
