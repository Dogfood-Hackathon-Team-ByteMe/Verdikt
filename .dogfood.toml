# DOGFOOD 2026 submission manifest.

[project]
name = "Verdikt"
tagline = "Open, self-hostable hackathon submissions and judging."
repo = "https://github.com/Dogfood-Hackathon-Team-ByteMe/Verdikt"
license = "MIT"

[tiers]
# Claim only what the acceptance report proves. Every T2 feature below has
# HTTP-level tests in tests/backend/stageF-stageH and a browser check; every
# T3 feature has them in stageI-stageJ; every T4 feature in stageK-stageM.
claimed = ["T1", "T2", "T3", "T4"]
t1 = "complete"
t2 = "complete"  # judge invites (email-bound, single use) and batch assignment
                 # (N reviews per entry, track-isolated, load-balanced);
                 # organizer-weighted rubric; role isolation enforced server-side
                 # (a judge scores only their track or batch); live organizer
                 # dashboard; cross-judge normalization, method and proof in
                 # JUDGING.md; CSV export for entries, assignments, ballots and
                 # standings.
t3 = "complete"  # anti-abuse (per-account + per-address rate limits on
                 # sign-in, registration, writes, comments and the keyless
                 # surface; append-only audit trail of every panel change);
                 # community voting (one vote per person, unique-indexed,
                 # never touches the judged standings; organisers, judges,
                 # own team and admins cannot vote); public comment threads
                 # with organizer moderation recorded in the trail; and the
                 # versioned keyless read API documented in API.md.
                 # run.py carries probes only for T1/T2; the T3 proof is the
                 # HTTP-level suites stageI + stageJ in the acceptance report.
t4 = "complete"  # webhooks (organizer-registered, HMAC-SHA256-signed
                 # deliveries with a retry-and-redeliver log, never able to
                 # break the action they announce); certificates and signed
                 # judge participation records (Ed25519, verified keylessly at
                 # /api/v1/certificates/:serial or offline with the public
                 # key); an embeddable gallery widget (self-contained HTML,
                 # /api/v1/events/:id/embed); bulk export/import (one JSON
                 # bundle, no credentials, round-trips the ranking exactly);
                 # and the REST API the SPA itself drives -- every UI action
                 # -- documented as OpenAPI at /api/v1/openapi.json.
                 # Proof: HTTP-level suites stageK-stageM in the report.

[acceptance]
report = "acceptance-report.txt"
command = "npm install && npm run acceptance"
tests_total = 295
tests_passed = 295

[run]
command = "docker compose up"
web = "http://localhost:3000"
api = "http://localhost:8080"

[routes]
# Paths the frontend depends on.
auth_register    = "POST /api/auth/register"
auth_login       = "POST /api/auth/login"
auth_logout      = "POST /api/auth/logout"
auth_me          = "GET  /api/auth/me"
events           = "GET /api/events"
event_featured   = "GET /api/events/featured"
tracks           = "GET /api/tracks"
project_detail   = "GET /api/projects/:id"
teams            = "GET /api/teams"
invite_preview   = "GET /api/invites/token/:token"
invite_accept    = "POST /api/invites/token/:token/accept"
ballot           = "PUT /api/scores/ballot"
scores           = "GET /api/scores?eventId=:id"
track_judges     = "POST /api/tracks/:id/judges"
track_judge      = "DELETE /api/tracks/:id/judges/:userId"
standings        = "GET /api/events/:id/standings"
standings_csv    = "GET /api/events/:id/standings.csv"
entries_csv      = "GET /api/events/:id/entries.csv"
assignments      = "GET|POST|DELETE /api/events/:id/assignments"
assign_auto      = "POST /api/events/:id/assignments/auto"
assignments_csv  = "GET /api/events/:id/assignments.csv"
judge_queue      = "GET /api/judge/queue?eventId=:id"
judge_invites    = "GET|POST /api/tracks/:id/judge-invites"
judge_invite     = "GET /api/judge-invites/token/:token"
judge_accept     = "POST /api/judge-invites/token/:token/accept"
vote             = "POST|DELETE /api/projects/:id/vote"
community        = "GET /api/events/:id/community"
comments         = "GET|POST /api/projects/:id/comments"
comment          = "DELETE /api/comments/:id"
audit            = "GET /api/events/:id/audit"
public_api       = "GET /api/v1"
health           = "GET /health"
webhooks         = "GET|POST /api/events/:id/webhooks"
webhook          = "DELETE /api/webhooks/:id"
webhook_log      = "GET /api/webhooks/:id/deliveries"
redeliver        = "POST /api/webhooks/:id/deliveries/:deliveryId/redeliver"
certificates     = "GET|POST /api/events/:id/certificates"
my_certificates  = "GET /api/certificates/mine"
verify_cert      = "GET /api/v1/certificates/:serial"
signing_key      = "GET /api/v1/keys/current"
embed_widget     = "GET /api/v1/events/:id/embed"
export_event     = "GET /api/events/:id/export"
import_event     = "POST /api/events/import"
openapi          = "GET /api/v1/openapi.json"

# Bare paths used by run.py. It appends nothing and sends no method,
# so each of these is a complete URL path.
gallery      = "/api/projects"
submit       = "/api/projects/6ab919034094777524ec213c/submit"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/scores?judge=6ab8d8933c07ed286e6c8ad9"
csv_export   = "/api/export.csv?eventId=6ab919024094777524ec2030"
[demo]
password = "dogfood2026"
admin = "admin@verdikt.dev"
organizer = "organizer@verdikt.dev"
judge = "judge@verdikt.dev"
participant = "participant@verdikt.dev"

[bonus]
# normalization_proof: `npm run normalization-proof` simulates events with
# known entry quality and known judge bias and measures each method's ranking
# against the truth, including the case where the textbook method fails. The
# suite re-checks those properties. Results and caveats are in JUDGING.md.
# The rest are not claimed, and are listed so the gap is explicit.
normalization_proof = true
pairwise_mode = false
threat_model = false
# api_first: the whole surface -- the session API the SPA drives plus the
# keyless /api/v1 -- is described as OpenAPI 3.0, served by the API itself at
# GET /api/v1/openapi.json and checked by a test that the spec names the
# routes the app really has.
api_first = true

[portal]
base_url = "http://localhost:8080"
